name: Python
on:
  push:
    tags:
      - 'v*'
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i 3.10 3.11 3.12 3.13 --sdist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -i 3.10 3.11 3.12 3.13
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist -i 3.10 3.11 3.12 3.13
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist
  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          args: --release --out dist -i 3.10 3.11 3.12 3.13
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cross
          path: dist
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [macos, windows, linux, linux-cross]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Build index
        run: |
          mkdir -p index/peppi-py
          cp *.whl *.tar.gz index/peppi-py/ 2>/dev/null || true
          echo '<!DOCTYPE html><html><body>' > index/index.html
          echo '<a href="peppi-py/">peppi-py</a>' >> index/index.html
          echo '</body></html>' >> index/index.html
          cd index/peppi-py
          echo '<!DOCTYPE html><html><body>' > index.html
          for f in *; do
            [ "$f" = "index.html" ] && continue
            echo "<a href=\"$f\">$f</a>" >> index.html
          done
          echo '</body></html>' >> index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: index
          keep_files: true
